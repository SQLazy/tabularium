# Every push to main: the full test suite, including the real x402 paywall locally on testnet. If Worker files
# changed, deploy to Cloudflare, then run the free live checks against production (every paid route answers 402
# with the menu price and payee; openapi.json, llms.txt and /stats agree). Manual runs deploy unconditionally.
# Secrets: CLOUDFLARE_API_TOKEN (Workers edit), CLOUDFLARE_ACCOUNT_ID, TESTNET_PAYER_KEY. Worker secrets (signing
# key, CDP keys) live in Cloudflare and are never touched by this workflow.
name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the changes job looks up the last run that actually deployed

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.diff.outputs.worker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Compare with the commit that last DEPLOYED, not the previous push: a push whose deploy failed (say, a testnet
      # flake in the paywall job) must not be forgotten by the next push that only touches tests or docs.
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "worker=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          before=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&per_page=50" --jq '.workflow_runs[] | select(.conclusion=="success") | .id'); do
            deployed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name=="deploy" and .conclusion=="success")] | length')
            if [ "$deployed" -gt 0 ]; then before=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .head_sha); break; fi
          done
          echo "last deployed commit: ${before:-none found}"
          if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then echo "worker=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff --name-only "$before" "${{ github.sha }}")"
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/|wrangler\.jsonc$|package\.json$|package-lock\.json$|tsconfig\.json$)'; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    uses: ./.github/workflows/test.yml
    with:
      paywall: true
    secrets:
      TESTNET_PAYER_KEY: ${{ secrets.TESTNET_PAYER_KEY }}

  deploy:
    needs: [changes, test]
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Live checks (free; nothing is charged)
        run: |
          for i in 1 2 3; do node scripts/live-check.mjs && exit 0; echo "retrying in 15 s"; sleep 15; done
          exit 1
