# ALL YOUR BASE: every hour, count what machines paid over x402 on Base in the last 24 hours (public chain data,
# scripts/ayb/collect.mjs) and commit ticker.json + names.json to the ayb-data branch, which /allyourbase serves.
# The Bazaar payee list (~90k listings) is refreshed once a day and cached in the branch.
name: All your base

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ayb
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check out the data branch (created on the first run)
        run: |
          if git ls-remote --exit-code --heads origin ayb-data > /dev/null; then
            git fetch -q origin ayb-data
            git worktree add -q ayb-data origin/ayb-data
            git -C ayb-data switch -q -C ayb-data
          else
            git worktree add -q --orphan -b ayb-data ayb-data
          fi
      - name: Count
        run: node scripts/ayb/collect.mjs ayb-data
      - name: Commit
        working-directory: ayb-data
        run: |
          git config user.name "tabularium-ayb[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ticker.json names.json sellers.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "count $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin ayb-data
